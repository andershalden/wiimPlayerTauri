[package]
name = "wiimplayer"
version = "0.1.0"
description = "Lightweight WiiM remote and local/DLNA music player"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wiimplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false }
quick-xml = "=0.37.5"
url = "2"
percent-encoding = "2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
mime = "0.3"
walkdir = "2"
lofty = "0.22"
dirs = "6"
fastrand = "2"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
